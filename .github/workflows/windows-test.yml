name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Test-Switch.ps1
      - name: Build portable package
        shell: powershell
        run: .\Build-Package.ps1
